name: Snapuary
options:
  bundleIdPrefix: com.dreamking
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_NAME: Snapuary
    SWIFT_VERSION: 5.10
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Snapuary needs photo library access to organize screenshots and tagged images.
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Snapuary needs permission to save protected screenshots and manage cleanup results.
targets:
  Snapuary:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dreamking.snapuary
        TARGETED_DEVICE_FAMILY: 1,2
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - SnapuaryTests
  SnapuaryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SnapuaryTests
    dependencies:
      - target: Snapuary

